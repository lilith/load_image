[package]
authors = ["Kornel <pornel@pornel.net>"]
description = "Load PNG or JPEG"
keywords = ["load_image"]
license = "AGPL-3.0"
name = "load_image"
publish = false
version = "2.10.3"

[dependencies]
imgref = "1.3.3"
lcms2 = "5.0.0"
lodepng = "2.1.1"
rexif = "0.3.5"
rgb = "0.8.5"

[dependencies.mozjpeg]
path = "../mozjpeg-rust"
version = "0.8.0"

[features]
static = ["lcms2/static"]
stat = []

[lib]
doctest = false
name = "load_image"
