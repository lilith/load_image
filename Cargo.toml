[package]
authors = ["Kornel <pornel@pornel.net>"]
description = "Load PNG or JPEG with color profile support"
keywords = ["load_image"]
license = "AGPL-3.0"
name = "load_image"
version = "2.12.0"
edition = "2018"
include = ["src/*.rs", "src/*.icc", "Cargo.toml", "COPYING"]

[dependencies]
imgref = "1.3.3"
lcms2 = "5.0.1"
lodepng = "2.2.0"
rexif = "0.3.5"
rgb = "0.8.13"
mozjpeg = "0.8.5"

[features]
static = ["lcms2/static"]
stat = []

[lib]
doctest = false
name = "load_image"
