[package]
authors = ["Kornel <pornel@pornel.net>"]
description = "Load PNG or JPEG"
keywords = ["load_image"]
license = "AGPL-3.0"
name = "load_image"
publish = false
version = "2.8.2"

[dependencies]
file = "1.0.0"
imgref = "1.0.0"
lcms2 = "4.2.0"
lodepng = "1.1.2"
rexif = "0.3.5"
rgb = "0.7"

[dependencies.mozjpeg]
path = "../mozjpeg-rust"
version = "0.8.0"

[features]
static = ["lcms2/static"]

[lib]
doctest = false
name = "load_image"
